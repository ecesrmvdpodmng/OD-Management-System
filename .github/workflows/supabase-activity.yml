      - name: Check Supabase database activity
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          response=$(curl --silent --show-error \
            --get \
            --output /tmp/response.txt \
            --write-out "%{http_code}" \
            --url "${SUPABASE_URL}/rest/v1/departments?select=id&limit=1" \
            --header "apikey: ${SUPABASE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_KEY}")

          echo "Supabase HTTP status: $response"

          if [ "$response" -lt 200 ] || [ "$response" -ge 300 ]; then
            echo "Supabase query failed."
            cat /tmp/response.txt
            exit 1
          fi

          echo "Read-only database query succeeded."
